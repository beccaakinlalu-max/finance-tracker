<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BudgetBuddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f7; --card: #fbfcfe; --text: #1f2937; --muted: #6b7280;
    --border: #d9dee8; --income: #16a34a; --expense: #e5645a;
    --shadow: 0 4px 14px rgba(30,41,59,.08);
  }
  [data-theme="dark"] {
    --bg: #0f172a; --card: #1e293b; --text: #e5e7eb; --muted: #94a3b8;
    --border: #334155; --income: #4ade80; --expense: #f87171;
    --shadow: 0 4px 14px rgba(0,0,0,.35);
  }
  body { font-family: 'Poppins', system-ui, sans-serif; background: var(--bg); color: var(--text); max-width: 480px; margin: 0 auto; padding: 24px 16px; transition: background .3s, color .3s; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  h1 { font-size: 1.6rem; margin: 0; }
  h1 span { background: linear-gradient(90deg, #6366f1, #a855f7); -webkit-background-clip: text; background-clip: text; color: transparent; }
  form { display: grid; gap: 10px; background: var(--card); padding: 16px; border-radius: 14px; box-shadow: var(--shadow); }
  input, select { font: inherit; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); }
  button { font: inherit; font-weight: 600; padding: 11px; border: none; border-radius: 10px; color: #fff; background: linear-gradient(90deg, #6366f1, #a855f7); cursor: pointer; transition: transform .15s; }
  button:hover { transform: translateY(-2px); }
  #themeToggle { width: 42px; height: 42px; padding: 0; font-size: 1.2rem; background: var(--card); box-shadow: var(--shadow); border-radius: 50%; }
  #summary { background: var(--card); padding: 14px; border-radius: 14px; margin: 16px 0; font-weight: 600; box-shadow: var(--shadow); }
  ul { list-style: none; padding: 0; }
  li { background: var(--card); padding: 12px 14px; border-radius: 12px; margin-bottom: 8px; box-shadow: var(--shadow); border-left: 5px solid var(--muted); }
  li.income { border-left-color: var(--income); }
  li.expense { border-left-color: var(--expense); }
</style>
</head>
<body>
<header>
  <h1>💰 <span>BudgetBuddy</span></h1>
  <button id="themeToggle" type="button" aria-label="Switch theme">🌙</button>
</header>

  <form id="txForm">
    <input id="amount" type="number" inputmode="decimal" placeholder="Amount (₦)" required>
    <select id="type">
      <option value="expense">Expense</option>
      <option value="income">Income</option>
    </select>
    <input id="category" type="text" placeholder="Category (e.g. Food)" required>
    <button type="submit">Add</button>
  </form>
<p id="summary"></p>
  <ul id="list"></ul>
<script>
  const form = document.getElementById('txForm');
  const list = document.getElementById('list');
const summary = document.getElementById('summary'); 
const toggle = document.getElementById('themeToggle');
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  toggle.textContent = t === 'dark' ? '☀️' : '🌙';
}
let theme = 'dark';
try { theme = localStorage.getItem('theme') || 'dark'; } catch (e) {}
applyTheme(theme);
toggle.addEventListener('click', function () {
  theme = theme === 'dark' ? 'light' : 'dark';
  applyTheme(theme);
  try { localStorage.setItem('theme', theme); } catch (e) {}
});
  let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

  function save() {
    localStorage.setItem('transactions', JSON.stringify(transactions));
  }

  
    function show() {
  list.innerHTML = '';
  let income = 0, expense = 0;
  transactions.forEach(function (t) {
    if (t.type === 'income') income += t.kobo;
    else expense += t.kobo;
    const li = document.createElement('li');
  li.className = t.type;
    li.textContent = t.type + ': ₦' + (t.kobo / 100).toLocaleString() + ' - ' + t.category;
    list.appendChild(li);
  });
  const fmt = function (k) { return '₦' + (k / 100).toLocaleString(); };
  summary.textContent = 'Income: ' + fmt(income) +
    ' | Expenses: ' + fmt(expense) +
    ' | Balance: ' + fmt(income - expense);
}
  

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const amount = parseFloat(document.getElementById('amount').value);
    if (!(amount > 0)) return;
    transactions.push({
      id: Date.now(),
      kobo: Math.round(amount * 100),
      type: document.getElementById('type').value,
      category: document.getElementById('category').value.trim()
    });
    save();
    show();
    form.reset();
  });

  show();
</script>
</body>
